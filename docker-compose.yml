# Single-machine stack: PostgreSQL (pgvector) + API (the image runs the migrations on start).
# Ports are published on 127.0.0.1 and off the defaults, so they never collide with a host
# PostgreSQL (5432), Redis (6379) or the Supabase CLI stack (54321-54324). Interpolated values
# come from the root .env (copy .env.example); the API also reads backend/.env.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-intelliclass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the root .env}
      POSTGRES_DB: ${POSTGRES_DB:-intelliclass}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-intelliclass}"]
      interval: 5s
      timeout: 3s
      retries: 10


  api:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-intelliclass}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the root .env}@db:5432/${POSTGRES_DB:-intelliclass}
      # local: PNGs on the api_storage volume. supabase: SUPABASE_URL must be reachable from inside
      # the container, e.g. http://host.docker.internal:54321 for the Supabase CLI stack on the host.
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_DIR: /app/storage
      SUPABASE_URL: ${SUPABASE_URL:-}
      REDIS_URL: ${REDIS_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - api_storage:/app/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  # Only needed when the API runs as several replicas (decision D16): `docker compose --profile redis up`.
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  api_storage:
